# Revisa cada cambio antes de que llegue al sitio publicado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas de componentes y contenido (Vitest)
        run: npm test
      - name: Tipos (modo estricto) y build
        run: npm run build
      - name: El build incluye seguridad y página 404
        run: test -f dist/_headers && test -f dist/404.html && test -f dist/theme-init.js
      - name: Pruebas de extremo a extremo y accesibilidad (Playwright + axe)
        run: npx playwright test
      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-playwright
          path: test-results
          retention-days: 7
