# Netlify construye el sitio desde este repositorio en cada push a main.
# Los encabezados de seguridad y caché están en public/_headers (no duplicarlos aquí).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El sitio se mudó a leodevrd.com (Cloudflare Pages, ignora este archivo): 301 para conservar el SEO.
[[redirects]]
  from = "https://leodev-rd.netlify.app/*"
  to = "https://leodevrd.com/:splat"
  status = 301
  force = true
